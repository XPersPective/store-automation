name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile tool/factory.py tool/install-skill.py tool/sessions.py tool/subscriptions.py tool/release.py tool/ios-evidence.py tool/artifacts.py tool/dispatch.py tool/native_agents.py
      - name: Native process and public publishing checks
        run: |
          python -m unittest discover -s tests -p test_sessions.py -v
          python -m unittest discover -s tests -p test_subscriptions.py -v
          python -m unittest discover -s tests -p test_release.py -v
          python -m unittest discover -s tests -p test_install_skill.py -v
          python -m unittest discover -s tests -p test_ios_evidence.py -v
          python -m unittest discover -s tests -p test_catalogue.py -v
          python -m unittest discover -s tests -p test_authority.py -v
          python -m unittest discover -s tests -p test_artifacts.py -v
          python -m unittest discover -s tests -p test_discovery.py -v
          python -m unittest discover -s tests -p test_native_lifecycle.py -v
