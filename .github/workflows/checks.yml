name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile tool/factory.py tool/install-skill.py tool/sessions.py tool/release.py
      - name: Native process and public publishing checks
        run: |
          python -m unittest discover -s tests -p test_sessions.py -v
          python -m unittest discover -s tests -p test_release.py -v
